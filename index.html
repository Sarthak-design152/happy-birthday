<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday, My Love!</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Quicksand', 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  background-attachment: fixed;
  min-height: 100vh;
  color: #fff;
  padding: 20px;
  line-height: 1.6;
  overflow-x: hidden;
}
.container { max-width: 880px; margin: 0 auto; position: relative; z-index: 2; }
.hero { text-align: center; padding: 60px 20px 30px; }
.hero-title {
  font-family: 'Dancing Script', cursive;
  font-size: 3rem;
  color: #fff;
  margin-bottom: 10px;
  font-weight: 700;
  text-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.hero-sub { font-size: 1.1rem; color: rgba(255,255,255,0.7); margin-bottom: 16px; }
.scroll-hint { font-family: 'Dancing Script', cursive; font-size: 1rem; color: rgba(255,255,255,0.4); }
section {
  padding: 24px 20px;
  margin-bottom: 20px;
  background: rgba(255,255,255,0.06);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}
section h2 {
  font-family: 'Dancing Script', cursive;
  font-size: 1.8rem;
  color: #fff;
  margin-bottom: 16px;
  text-align: center;
}
section h2 .icon { margin-right: 8px; }
.profile-pic { width: 160px; height: 160px; border-radius: 50%; margin: 0 auto 24px; overflow: hidden; border: 4px solid rgba(255,215,0,0.4); box-shadow: 0 0 40px rgba(255,215,0,0.25), 0 0 80px rgba(255,215,0,0.1); animation: profileGlow 3s ease-in-out infinite; } @keyframes profileGlow { 0%,100% { box-shadow: 0 0 30px rgba(255,215,0,0.15); } 50% { box-shadow: 0 0 60px rgba(255,215,0,0.35); } } }
.profile-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
  margin: 16px 0;
}.photo-strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
.photo-strip img { height: 100px; border-radius: 10px; }
.reasons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.reason-card { padding: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
.reason-card .num { font-weight: 700; color: #ffd700; margin-right: 6px; }
.youre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.youre-card { padding: 16px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); text-align: center; }
.youre-emoji { font-size: 2rem; display: block; margin-bottom: 6px; }
.youre-label { font-family: 'Dancing Script', cursive; font-size: 1rem; color: #fff; }
.cake-section { text-align: center; padding: 20px 0; }
.cake-emoji { font-size: 4rem; }
.candle { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 2rem; cursor: pointer; animation: candleFlicker 1s infinite alternate; z-index: 5; } .candle.blown { opacity: 0; animation: none; } @keyframes candleFlicker { 0% { transform: translateX(-50%) scale(1) rotate(-2deg); } 100% { transform: translateX(-50%) scale(1.1) rotate(2deg); } }
.love-meter { padding: 20px; text-align: center; background: rgba(255,255,255,0.06); border-radius: 16px; cursor: pointer; position: relative; overflow: hidden; }
.meter-bar { width: 100%; height: 14px; background: rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; margin: 10px 0; }
.meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f093fb, #f5576c); border-radius: 8px; transition: width 1.5s; }
.quote-box { text-align: center; padding: 16px; background: rgba(255,255,255,0.06); border-radius: 16px; cursor: pointer; }
.quote-text { font-family: 'Dancing Script', cursive; font-size: 1.2rem; }
.quote-author { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-top: 6px; }
.mischief-btn, .supernova-btn { display: block; margin: 12px auto 0; padding: 14px 32px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; color: #fff; }
.mischief-btn { background: linear-gradient(135deg, #f5576c, #ff6f91); }
.supernova-btn { background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe); font-family: 'Dancing Script', cursive; font-size: 1.2rem; }
.music-btn { position: fixed; bottom: 20px; right: 20px; z-index: 999; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 1.3rem; }
.music-btn.paused { opacity: 0.5; }
#starsCanvas { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#fireworksCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998; pointer-events: none; }
#petalsCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#heartbeatCanvas { width: 100%; height: 180px; border-radius: 12px; margin-top: 10px; }
#loveStarsCanvas { width: 100%; height: 260px; border-radius: 12px; margin-top: 10px; }
.shooting-star { position: fixed; width: 150px; height: 2px; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.8)); border-radius: 2px; z-index: 1; pointer-events: none; opacity: 0; }
.shooting-star::after { content: ''; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #fff, 0 0 40px #fff; }
@keyframes shoot {
  0% { transform: translate(0,0) rotate(-35deg); opacity: 0; }
  5% { opacity: 1; }
  30% { transform: translate(300px, 200px) rotate(-35deg); opacity: 0.8; }
  100% { transform: translate(800px, 500px) rotate(-35deg); opacity: 0; }
}
.float-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
.float-item { position: absolute; bottom: -60px; opacity: 0.5; animation: floatUp linear infinite; pointer-events: none; }
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
  100% { transform: translateY(-120vh) rotate(720deg) scale(0.3); opacity: 0; }
}
.sparkle-container, .petals-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.sparkle { position: absolute; border-radius: 50%; background: #ffd700; box-shadow: 0 0 6px #ffd700; animation: sparklePulse ease-in-out infinite alternate; }
@keyframes sparklePulse {
  0% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 0.8; transform: scale(1.2); }
  100% { opacity: 0; transform: scale(0.5); }
}
.petal { position: absolute; animation: petalFall linear infinite; }
@keyframes petalFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 0.6; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
#ytPlayerWrapper { display: none; }
.love-note { position: fixed; z-index: 997; bottom: -80px; padding: 10px 24px; background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 50px; color: #fff; font-family: 'Dancing Script', cursive; font-size: 1.1rem; pointer-events: none; animation: noteFloat 8s linear forwards; }
@keyframes noteFloat {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  10% { opacity: 0.7; transform: scale(1); }
  100% { transform: translateY(-120vh) scale(0.8); opacity: 0; }
}
.supernova-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, #667eea, #764ba2); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
.supernova-overlay.show { display: flex; }
.supernova-content { max-width: 600px; width: 95%; background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 32px; padding: 40px 32px; border: 1px solid rgba(255,255,255,0.15); text-align: center; position: relative; overflow-y: auto; max-height: 85vh; }
.sn-close { position: absolute; top: 16px; right: 20px; font-size: 2rem; color: rgba(255,255,255,0.5); cursor: pointer; z-index: 3001; }
.sn-text { font-family: 'Dancing Script', cursive; font-size: 1.5rem; line-height: 2; color: #fff; text-align: center; }
.sn-particle { position: absolute; pointer-events: none; border-radius: 50%; animation: particleBurst 2s ease-out forwards; }
@keyframes particleBurst {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}
@keyframes heartFloat {
  0% { opacity:1; transform:translateY(0) scale(1); }
  100% { opacity:0; transform:translateY(-80px) scale(0.3); }
}
@keyframes snFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes snScale { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>

<style>
/* Interactive buttons */
.interactive-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 10px 0;
}
.int-btn {
  padding: 18px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06);
  color: #fff;
  font-family: 'Dancing Script', cursive;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  overflow: hidden;
}
.int-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,215,0,0.3);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.int-btn:active {
  transform: scale(0.95);
  transition-duration: 0.1s;
}
.int-btn .int-icon { font-size: 1.8rem; }
.int-btn .int-label { font-size: 1rem; }
.int-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.15) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.int-btn:hover::after { opacity: 1; }

/* Clickable reason cards */
.reason-card {
  cursor: pointer;
  transition: all 0.3s ease;
  user-select: none;
  position: relative;
  overflow: hidden;
}
.reason-card:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,215,0,0.2);
  transform: translateX(4px);
}
.reason-card:active {
  transform: scale(0.97);
}
.reason-card .heart-burst {
  position: absolute;
  pointer-events: none;
  animation: heartBurst 0.8s ease-out forwards;
  font-size: 1.2rem;
}
@keyframes heartBurst {
  0% { transform: translate(0,0) scale(0.5); opacity: 1; }
  100% { transform: translate(var(--hx), var(--hy)) scale(1.5); opacity: 0; }
}

/* Clickable youre cards */
.youre-card {
  cursor: pointer;
  transition: all 0.3s ease;
  user-select: none;
  position: relative;
  overflow: visible;
}
.youre-card:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,215,0,0.2);
  transform: scale(1.05);
}
.youre-card:active {
  transform: scale(0.95);
}
.youre-popup {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0);
  background: rgba(0,0,0,0.88);
  padding: 30px 40px;
  border-radius: 24px;
  border: 2px solid rgba(255,215,0,0.3);
  z-index: 99999;
  text-align: center;
  pointer-events: none;
  animation: popupAnim 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes popupAnim {
  0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
  100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
}
.youre-popup .popup-emoji { font-size: 3rem; display: block; margin-bottom: 10px; }
.youre-popup .popup-text { font-family: 'Dancing Script', cursive; font-size: 1.4rem; color: #ffd700; }

/* Click ripple on all buttons/clickable */
.click-ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transform: scale(0);
  animation: rippleAnim 0.6s ease-out forwards;
  pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}
</style></head>
<body>

<!-- Password Gate -->
<div id="passwordGate" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);z-index:100000;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Quicksand',sans-serif;">
  <div style="text-align:center;padding:30px;max-width:380px;width:90%;">
    <div style="font-size:3rem;margin-bottom:10px;">🔒</div>
    <div style="font-family:'Dancing Script',cursive;font-size:2rem;color:#fff;margin-bottom:6px;">Secret Surprise</div>
    <div style="color:rgba(255,255,255,0.6);font-size:0.95rem;margin-bottom:24px;">Enter the password to unlock</div>
    <input type="password" id="passwordInput" placeholder="Enter password..."
      style="width:100%;padding:14px 18px;border-radius:50px;border:2px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-size:1rem;text-align:center;outline:none;transition:border-color 0.3s;"
      onfocus="this.style.borderColor='#ffd700'" onblur="this.style.borderColor='rgba(255,255,255,0.2)'"
      onkeydown="if(event.key==='Enter')checkPassword()">
    <button onclick="checkPassword()"
      style="margin-top:14px;width:100%;padding:14px;border-radius:50px;border:none;background:linear-gradient(135deg,#ffd700,#ffaa00);color:#764ba2;font-weight:700;font-size:1rem;cursor:pointer;transition:transform 0.2s;"
      onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
      Unlock &#x1F49B;
    </button>
    <div id="passwordError" style="margin-top:12px;font-size:0.85rem;color:#ff6b6b;min-height:20px;"></div>
    <div style="margin-top:20px;font-size:0.8rem;color:rgba(255,255,255,0.3);">&#x2728; A special surprise awaits &#x2728;</div>
  </div>
</div>

<!-- Lightbox for gallery -->
<style>
.lightbox-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.92); z-index: 99999;
  display: none; align-items: center; justify-content: center;
  cursor: pointer;
}
.lightbox-overlay.active { display: flex; }
.lightbox-overlay img {
  max-width: 90vw; max-height: 90vh;
  border-radius: 12px; box-shadow: 0 0 60px rgba(255,215,0,0.3);
  transform: scale(0.8); transition: transform 0.3s ease;
}
.lightbox-overlay.active img { transform: scale(1); }
.lightbox-close {
  position: fixed; top: 20px; right: 30px;
  color: #fff; font-size: 2.5rem; cursor: pointer;
  opacity: 0.7; transition: opacity 0.3s; z-index: 100000;
}
.lightbox-close:hover { opacity: 1; }
.lightbox-counter {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.5); font-size: 0.9rem;
  font-family: 'Quicksand', sans-serif;
}
.lightbox-nav {
  position: fixed; top: 50%; transform: translateY(-50%);
  color: #fff; font-size: 3rem; cursor: pointer;
  opacity: 0.5; transition: opacity 0.3s; padding: 20px;
  z-index: 100000; user-select: none;
}
.lightbox-nav:hover { opacity: 1; }
.lightbox-prev { left: 10px; }
.lightbox-next { right: 10px; }</style>
<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <span class="lightbox-nav lightbox-prev" onclick="event.stopPropagation();navLightbox(-1)">&#10094;</span>
  <img id="lightboxImg" src="" alt="">
  <span class="lightbox-nav lightbox-next" onclick="event.stopPropagation();navLightbox(1)">&#10095;</span>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>
<script>
var lightboxImages = [];
var currentIdx = 0;
function openLightbox(idx) {
  var imgs = document.querySelectorAll('.gallery-card img');
  lightboxImages = Array.from(imgs).map(function(i) { return i.src; });
  currentIdx = idx;
  updateLightbox();
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function updateLightbox() {
  document.getElementById('lightboxImg').src = lightboxImages[currentIdx];
  document.getElementById('lightboxCounter').textContent = (currentIdx + 1) + ' / ' + lightboxImages.length;
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}
function navLightbox(dir) {
  currentIdx = (currentIdx + dir + lightboxImages.length) % lightboxImages.length;
  updateLightbox();
}
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});
</script>

<script>
// Make reason cards interactive
document.addEventListener('DOMContentLoaded', function() {
  var reasons = document.querySelectorAll('.reason-card');
  reasons.forEach(function(card) {
    card.addEventListener('click', function(e) {
      // Heart burst effect
      var hearts = ['&#x2764;&#xFE0F;', '&#x1F49B;', '&#x1F49D;', '&#x1F493;', '&#x1F498;', '&#x2764;'];
      for (var i = 0; i < 6; i++) {
        var h = document.createElement('span');
        h.className = 'heart-burst';
        h.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
        var angle = Math.random() * Math.PI * 2;
        var dist = 40 + Math.random() * 60;
        h.style.setProperty('--hx', Math.cos(angle) * dist + 'px');
        h.style.setProperty('--hy', Math.sin(angle) * dist + 'px');
        h.style.left = '50%';
        h.style.top = '50%';
        h.style.animationDelay = (i * 0.05) + 's';
        card.appendChild(h);
        setTimeout(function() { h.remove(); }, 1000);
      }
    });
  });

  // Make "youre my" cards interactive
  var youreCards = document.querySelectorAll('.youre-card');
  youreCards.forEach(function(card) {
    card.addEventListener('click', function(e) {
      var emoji = this.querySelector('.youre-emoji')?.textContent || '&#x1F49B;';
      var label = this.querySelector('.youre-label')?.textContent || 'You're my everything';
      var popup = document.createElement('div');
      popup.className = 'youre-popup';
      popup.innerHTML = '<span class="popup-emoji">' + emoji + '</span><div class="popup-text">' + label + '</div>';
      document.body.appendChild(popup);
      setTimeout(function() {
        popup.style.transform = 'translate(-50%,-50%) scale(0.8)';
        popup.style.opacity = '0';
        setTimeout(function() { popup.remove(); }, 400);
      }, 1800);
    });
  });

  // Add ripple effect to all clickable elements
  function addRipple(e) {
    var el = e.currentTarget;
    if (el.classList.contains('gallery-card') || el.classList.contains('lightbox-overlay') || el.classList.contains('love-note')) return;
    var rect = el.getBoundingClientRect();
    var ripple = document.createElement('span');
    ripple.className = 'click-ripple';
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    el.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 600);
  }
  document.querySelectorAll('.int-btn, .reason-card, .youre-card, .mischief-btn, .supernova-btn, .love-meter, [onclick]').forEach(function(el) {
    el.addEventListener('click', addRipple);
  });
});
</script></body>
</html>
