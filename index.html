<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday, My Love!</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Quicksand', 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  background-attachment: fixed;
  min-height: 100vh;
  color: #fff;
  padding: 20px;
  line-height: 1.6;
  overflow-x: hidden;
}
.container { max-width: 880px; margin: 0 auto; position: relative; z-index: 2; }
.hero { text-align: center; padding: 60px 20px 30px; }
.hero-title {
  font-family: 'Dancing Script', cursive;
  font-size: 3rem;
  color: #fff;
  margin-bottom: 10px;
  font-weight: 700;
  text-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.hero-sub { font-size: 1.1rem; color: rgba(255,255,255,0.7); margin-bottom: 16px; }
.scroll-hint { font-family: 'Dancing Script', cursive; font-size: 1rem; color: rgba(255,255,255,0.4); }
section {
  padding: 24px 20px;
  margin-bottom: 20px;
  background: rgba(255,255,255,0.06);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}
section h2 {
  font-family: 'Dancing Script', cursive;
  font-size: 1.8rem;
  color: #fff;
  margin-bottom: 16px;
  text-align: center;
}
section h2 .icon { margin-right: 8px; }
.profile-pic { width: 160px; height: 160px; border-radius: 50%; margin: 0 auto 24px; overflow: hidden; border: 4px solid rgba(255,215,0,0.4); box-shadow: 0 0 40px rgba(255,215,0,0.25), 0 0 80px rgba(255,215,0,0.1); animation: profileGlow 3s ease-in-out infinite; } @keyframes profileGlow { 0%,100% { box-shadow: 0 0 30px rgba(255,215,0,0.15); } 50% { box-shadow: 0 0 60px rgba(255,215,0,0.35); } } }
.profile-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
  margin: 10px 0;
}
.gallery-card {
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.1);
  transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
  aspect-ratio: 1;
  position: relative;
}
.gallery-card:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 24px rgba(0,0,0,0.3);
  border-color: rgba(255,215,0,0.4);
}
.gallery-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s;
}
.gallery-card:hover img {
  transform: scale(1.1);
}
.gallery-card::after {
  content: '\1F50D';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 1.5rem;
  opacity: 0;
  transition: all 0.3s;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.gallery-card:hover::after {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
.gallery-card:hover img { transform: scale(1.05); }
</style>
<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <span class="lightbox-nav lightbox-prev" onclick="event.stopPropagation();navLightbox(-1)">&#10094;</span>
  <img id="lightboxImg" src="" alt="">
  <span class="lightbox-nav lightbox-next" onclick="event.stopPropagation();navLightbox(1)">&#10095;</span>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>
<script>
var lightboxImages = [];
var currentIdx = 0;
function openLightbox(idx) {
  var imgs = document.querySelectorAll('.gallery-card img');
  lightboxImages = Array.from(imgs).map(function(i) { return i.src; });
  currentIdx = idx;
  updateLightbox();
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function updateLightbox() {
  document.getElementById('lightboxImg').src = lightboxImages[currentIdx];
  document.getElementById('lightboxCounter').textContent = (currentIdx + 1) + ' / ' + lightboxImages.length;
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}
function navLightbox(dir) {
  currentIdx = (currentIdx + dir + lightboxImages.length) % lightboxImages.length;
  updateLightbox();
}
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});
</script>

<!-- Lightbox for gallery -->
<style>
.lightbox-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.92); z-index: 99999;
  display: none; align-items: center; justify-content: center;
  cursor: pointer;
}
.lightbox-overlay.active { display: flex; }
.lightbox-overlay img {
  max-width: 90vw; max-height: 90vh;
  border-radius: 12px; box-shadow: 0 0 60px rgba(255,215,0,0.3);
  transform: scale(0.8); transition: transform 0.3s ease;
}
.lightbox-overlay.active img { transform: scale(1); }
.lightbox-close {
  position: fixed; top: 20px; right: 30px;
  color: #fff; font-size: 2.5rem; cursor: pointer;
  opacity: 0.7; transition: opacity 0.3s; z-index: 100000;
}
.lightbox-close:hover { opacity: 1; }
.lightbox-counter {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.5); font-size: 0.9rem;
  font-family: 'Quicksand', sans-serif;
}
.lightbox-nav {
  position: fixed; top: 50%; transform: translateY(-50%);
  color: #fff; font-size: 3rem; cursor: pointer;
  opacity: 0.5; transition: opacity 0.3s; padding: 20px;
  z-index: 100000; user-select: none;
}
.lightbox-nav:hover { opacity: 1; }
.lightbox-prev { left: 10px; }
.lightbox-next { right: 10px; }
.gallery-card { cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; }
.gallery-card:hover { transform: scale(1.03); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
.gallery-card img { transition: transform 0.4s; }
.gallery-card:hover img { transform: scale(1.05); }
</style>

  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

var lightboxImages = [];

function openLightbox(idx) {

  lightboxImages = Array.from(imgs).map(function(i) { return i.src; });
  currentIdx = idx;
  updateLightbox();
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function updateLightbox() {

  document.getElementById('lightboxCounter').textContent = (currentIdx + 1) + ' / ' + lightboxImages.length;
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}
function navLightbox(dir) {

  updateLightbox();
}
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);

</script>
</body>
</html>
