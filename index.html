<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday, My Love!</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Alex+Brush&family=Raleway:wght@300;400;600&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(135deg, #0d0500, #1a0a00, #2d1200, #1a0a00, #0d0500);
  background-size: 400% 400%;
  animation: sunsetShift 12s ease infinite;
  color: #f5e6d3;
  font-family: 'Raleway', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
@keyframes sunsetShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.container { max-width: 600px; margin: 0 auto; padding: 0 16px 60px; }

.hero {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 40px 20px;
  position: relative;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,107,53,0.12) 0%, transparent 60%);
}
.hero-title {
  font-family: 'Alex Brush', cursive; font-size: 3.5rem;
  color: #ffd700; text-shadow: 0 0 60px rgba(255,215,0,0.2);
  margin-bottom: 8px;
}
.hero-sub { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; color: rgba(245,230,211,0.5); margin-bottom: 24px; font-style: italic; }
.scroll-hint { font-family: 'Alex Brush', cursive; font-size: 1rem; color: rgba(245,230,211,0.25); animation: bounce 2s infinite; }

@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

section {
  padding: 28px 18px; margin-bottom: 18px;
  background: rgba(255,255,255,0.04);
  border-radius: 20px;
  border: 1px solid rgba(255,215,0,0.08);
  backdrop-filter: blur(8px);
}
section h2 {
  font-family: 'Cormorant Garamond', serif; font-size: 1.7rem;
  color: #ffd700; margin-bottom: 16px; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.profile-pic { width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px; overflow: hidden; border: 3px solid rgba(255,215,0,0.25); box-shadow: 0 0 50px rgba(255,215,0,0.1); }
.profile-pic img { width: 100%; height: 100%; object-fit: cover; }

.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin: 16px 0; }
.gallery-card { border-radius: 14px; overflow: hidden; cursor: pointer; border: 2px solid rgba(255,215,0,0.1); transition: all 0.35s; position: relative; aspect-ratio: 1; background: rgba(255,255,255,0.03); }
.gallery-card:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(255,107,53,0.2); border-color: rgba(255,215,0,0.35); }
.gallery-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
.gallery-card:hover img { transform: scale(1.15); }

.interactive-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 10px 0; }
.int-btn {
  padding: 16px; border-radius: 16px; border: 1px solid rgba(255,215,0,0.12);
  background: rgba(255,255,255,0.05); color: #f5e6d3;
  font-family: 'Cormorant Garamond', serif; font-size: 1rem;
  cursor: pointer; transition: all 0.25s;
  display: flex; flex-direction: column; align-items: center; gap: 6px; user-select: none;
}
.int-btn:hover { background: rgba(255,215,0,0.1); border-color: rgba(255,215,0,0.3); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255,107,53,0.15); }
.int-btn:active { transform: scale(0.94); }

.love-jar { text-align: center; padding: 28px 20px; background: rgba(255,255,255,0.04); border-radius: 20px; border: 1px solid rgba(255,215,0,0.08); cursor: pointer; transition: all 0.4s; user-select: none; position: relative; overflow: hidden; }
.love-jar:hover { background: rgba(255,215,0,0.06); border-color: rgba(255,215,0,0.25); transform: scale(1.02); }
.love-jar .jar-emoji { font-size: 3.5rem; display: block; }
.love-jar .jar-note-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); background: rgba(13,5,0,0.92); padding: 24px 28px; border-radius: 20px; border: 2px solid rgba(255,215,0,0.3); z-index: 10; min-width: 200px; pointer-events: none; }
.love-jar .jar-note-display.show { animation: jarAnim 0.5s forwards; }
@keyframes jarAnim { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
.love-jar .jar-note-text { font-family: 'Alex Brush', cursive; font-size: 1.4rem; color: #ffd700; }

.together-section { text-align: center; padding: 22px; background: rgba(255,255,255,0.04); border-radius: 20px; border: 1px solid rgba(255,215,0,0.08); }
.together-section .together-label { font-family: 'Alex Brush', cursive; font-size: 1.4rem; color: #ffd700; }
.together-section .together-count { font-family: 'Raleway', sans-serif; font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, #ff6b35, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

.meter-bar { width: 100%; height: 12px; background: rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden; margin: 10px 0; }
.meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff6b35, #ffd700, #ff6b35); background-size: 200%; border-radius: 10px; transition: width 1.5s; animation: shimmer 2s infinite; }
@keyframes shimmer { 0% { background-position: 0%; } 100% { background-position: 200%; } }

.reason-card { padding: 14px; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,215,0,0.08); cursor: pointer; transition: all 0.3s; }
.reason-card:hover { background: rgba(255,215,0,0.06); border-color: rgba(255,215,0,0.2); transform: translateX(4px); }
.reason-card:active { transform: scale(0.97); }
.hb { position: absolute; pointer-events: none; animation: hbAnim 0.8s ease-out forwards; font-size: 1.2rem; left: 50%; top: 50%; z-index: 5; }
@keyframes hbAnim { 0% { transform: translate(0,0) scale(0.5); opacity: 1; } 100% { transform: translate(var(--x),var(--y)) scale(1.5); opacity: 0; } }

.youre-card { padding: 16px; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,215,0,0.08); text-align: center; cursor: pointer; transition: all 0.3s; }
.youre-card:hover { background: rgba(255,215,0,0.06); border-color: rgba(255,215,0,0.2); transform: scale(1.05); }
.youre-card:active { transform: scale(0.95); }
.youre-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); background: rgba(13,5,0,0.88); padding: 30px 40px; border-radius: 24px; border: 2px solid rgba(255,215,0,0.3); z-index: 99999; text-align: center; pointer-events: none; animation: puAnim 0.4s forwards; }
@keyframes puAnim { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
.youre-popup .pe { font-size: 3rem; }
.youre-popup .pt { font-family: 'Alex Brush', cursive; font-size: 1.5rem; color: #ffd700; }

.cursor-heart { position: fixed; pointer-events: none; z-index: 99999; font-size: 1rem; animation: curHeart 1s ease-out forwards; }
@keyframes curHeart { 0% { transform: translate(0,0) scale(0.3); opacity: 0.9; } 100% { transform: translate(var(--hx),var(--hy)) scale(0.6); opacity: 0; } }

.floating-love-note { position: fixed; z-index: 9998; pointer-events: none; font-family: 'Alex Brush', cursive; font-size: 1.2rem; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.2); animation: floatAnim 6s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
@keyframes floatAnim { 0% { transform: translateY(0) rotate(-5deg) scale(0.5); opacity: 0; } 10% { opacity: 0.8; transform: translateY(-20px) rotate(0deg) scale(1); } 80% { opacity: 0.6; } 100% { transform: translateY(-300px) rotate(5deg) scale(0.8); opacity: 0; } }

#lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 50000; align-items: center; justify-content: center; }
#lightbox.show { display: flex; }
#lightbox img { max-width: 90%; max-height: 85vh; border-radius: 16px; box-shadow: 0 0 60px rgba(255,215,0,0.08); }
.lb-close { position: absolute; top: 20px; right: 24px; font-size: 2.5rem; color: rgba(255,255,255,0.4); cursor: pointer; z-index: 50001; }
.lb-prev, .lb-next { position: absolute; top: 50%; transform: translateY(-50%); font-size: 3rem; color: rgba(255,255,255,0.2); cursor: pointer; padding: 20px; user-select: none; z-index: 50001; }
.lb-prev { left: 10px; } .lb-next { right: 10px; }

#passwordGate { background: linear-gradient(135deg, #0d0500, #2d1200, #0d0500); background-size: 400%; animation: pwShift 8s ease infinite; }
@keyframes pwShift { 0%,100% { background-position: 0%; } 50% { background-position: 100%; } }

.supernova-overlay { background: radial-gradient(ellipse at center, #2d1200, #0d0500); }

.love-meter { padding: 20px; text-align: center; background: rgba(255,255,255,0.04); border-radius: 16px; cursor: pointer; position: relative; overflow: hidden; border: 1px solid rgba(255,215,0,0.08); }
.quote-box { text-align: center; padding: 16px; background: rgba(255,255,255,0.04); border-radius: 16px; cursor: pointer; border: 1px solid rgba(255,215,0,0.08); }
.quote-text { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: #f5e6d3; }
</style>
<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <span class="lightbox-nav lightbox-prev" onclick="event.stopPropagation();navLightbox(-1)">&#10094;</span>
  
  <span class="lightbox-nav lightbox-next" onclick="event.stopPropagation();navLightbox(1)">&#10095;</span>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>
<script>
var lightboxImages = [];
var currentIdx = 0;
function openLightbox(idx) {
  var imgs = document.querySelectorAll('.gallery-card img');
  lightboxImages = Array.from(imgs).map(function(i) { return i.src; });
  currentIdx = idx;
  updateLightbox();
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function updateLightbox() {
  document.getElementById('lightboxImg').src = lightboxImages[currentIdx];
  document.getElementById('lightboxCounter').textContent = (currentIdx + 1) + ' / ' + lightboxImages.length;
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}
function navLightbox(dir) {
  currentIdx = (currentIdx + dir + lightboxImages.length) % lightboxImages.length;
  updateLightbox();
}
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.reason-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var h = ['&#x2764;&#xFE0F;','&#x1F49B;','&#x1F49D;','&#x1F493;','&#x1F498;'];
      for (var i = 0; i < 6; i++) {
        var e = document.createElement('span');
        e.className = 'hb'; e.innerHTML = h[Math.floor(Math.random()*h.length)];
        var a = Math.random()*Math.PI*2 + i, d = 40+Math.random()*60;
        e.style.setProperty('--x', Math.cos(a)*d+'px');
        e.style.setProperty('--y', Math.sin(a)*d+'px');
        e.style.animationDelay = (i*0.05)+'s';
        card.appendChild(e);
        setTimeout(function(){e.remove();}, 1000);
      }
    });
  });
  document.querySelectorAll('.youre-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var em = this.querySelector('.youre-emoji')?.textContent || '&#x1F49B;';
      var lb = this.querySelector('.youre-label')?.textContent || "You're my everything";
      var p = document.createElement('div');
      p.className = 'youre-popup';
      p.innerHTML = '<span class="pe">'+em+'</span><div class="pt">'+lb+'</div>';
      document.body.appendChild(p);
      setTimeout(function(){
        p.style.transform = 'translate(-50%,-50%) scale(0.8)';
        p.style.opacity = '0';
        setTimeout(function(){p.remove();}, 400);
      }, 2000);
    });
  });
});
</script>
<script>
// ===== Cursor Heart Trail =====
(function() {
  var hearts = ['🌟','✨','🔥','🌠','💛','🥺','🌟'];
  document.addEventListener('mousemove', function(e) {
    var el = document.createElement('div');
    el.className = 'cursor-heart';
    el.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    var x = (Math.random()-0.5)*60;
    var y = -40 - Math.random()*60;
    el.style.left = (e.clientX) + 'px';
    el.style.top = (e.clientY) + 'px';
    el.style.setProperty('--hx', x + 'px');
    el.style.setProperty('--hy', y + 'px');
    el.style.fontSize = (0.8+Math.random()*0.8) + 'rem';
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 1000);
  });
})();

// ===== Floating Love Notes =====
(function() {
  var notes = [
    "You light up my world like the sunset 🌟",
    "Every moment with you is golden ✨",
    "You're my sunshine on every cloudy day 🔥",
    "My love for you burns brighter than the stars 🌠",
    "You are my forever sunset 💛",
    "I never knew warmth until I met you 🥺",
    "You make everything beautiful 🌟",
    "My heart glows for you ✨",
    "You're my everything 💛",
    "I love you more every day 💜",
    "You make life beautiful 💖",
    "Forever yours, always 💗",
    "My heart belongs to you ✨",
    "You are my sunshine 🌟",
    "Thinking of you always 💛",
    "You're the best thing in my life 💜",
    "I miss you when you're gone 💖",
    "You complete me 💗"
  ];
  function spawnNote() {
    var el = document.createElement('div');
    el.className = 'floating-love-note';
    el.textContent = notes[Math.floor(Math.random()*notes.length)];
    el.style.left = (10 + Math.random()*80) + '%';
    el.style.bottom = '-20px';
    el.style.animationDuration = (5 + Math.random()*4) + 's';
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 10000);
  }
  setInterval(spawnNote, 8000 + Math.random()*4000);
  // Spawn one immediately
  setTimeout(spawnNote, 2000);
})();

// ===== Love Notes Jar =====
var jarNotes = [
  "You are the most beautiful person I know, inside and out 💛",
  "Every day with you is a gift I cherish deeply 💜",
  "Your smile lights up my entire world 🌟",
  "I fall in love with you more and more each day 💖",
  "You're my best friend, my love, my everything 💗",
  "The way you laugh is my favorite sound in the universe ✨",
  "You make even the simplest moments feel magical 💛",
  "I thank the stars every day for bringing you into my life 🌟",
  "Your strength and kindness inspire me always 💜",
  "There's no one else I'd rather share this journey with 💖",
  "You are proof that true love exists 💗",
  "My world is brighter because you're in it ✨",
  "You're the sweetest dream I never want to wake up from 💛",
  "Every touch from you feels like coming home 🌟",
  "You have the purest heart I've ever known 💜"
];
function pickJarNote() {
  var display = document.getElementById('jarNoteDisplay');
  var text = document.getElementById('jarNoteText');
  var glow = document.getElementById('jarGlow');
  if (!display || !text) return;
  text.textContent = jarNotes[Math.floor(Math.random()*jarNotes.length)];
  display.classList.add('show');
  if (glow) { glow.style.transform = 'translate(-50%,-50%) scale(6)'; glow.style.opacity = '0'; setTimeout(function() { glow.style.transform = ''; glow.style.opacity = ''; }, 600); }
  setTimeout(function() { display.classList.remove('show'); }, 2500);
}

// ===== Together Forever Timer =====
(function() {
  function updateTimer() {
    var el = document.getElementById('togetherCount');
    if (!el) return;
    // A beautiful beginning - adjust this date if you'd like!
    var start = new Date('2024-02-14T00:00:00');
    var now = new Date();
    var diff = Math.floor((now - start) / 1000);
    var days = Math.floor(diff / 86400);
    var hours = Math.floor((diff % 86400) / 3600);
    var mins = Math.floor((diff % 3600) / 60);
    var secs = diff % 60;
    el.textContent = days + ' days, ' + hours + 'h ' + mins + 'm ' + secs + 's';
  }
  updateTimer();
  setInterval(updateTimer, 1000);
})();
</script>
</body>
</html>
