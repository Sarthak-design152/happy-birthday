<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Our Story ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Poppins;
  background: black;
  color: white;
}

/* 🎬 INTRO */
#intro {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #ff4d6d, black);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
}

#intro h1 {
  font-family: 'Great Vibes';
  font-size: 3em;
  color: #ffd1dc;
  text-align: center;
}

#enterBtn {
  margin-top: 20px;
  padding: 12px 18px;
  border: none;
  border-radius: 12px;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

/* 🌌 BACKGROUND */
.bg {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  filter: brightness(0.5) blur(1px);
  transition: 2s ease;
}

.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(255,0,100,0.2), black);
}

/* 💖 MAIN CARD */
.card {
  position: absolute;
  z-index: 10;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 360px;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 60px rgba(255,0,100,0.4);
  text-align: center;
}

h1 {
  font-family: 'Great Vibes';
  font-size: 2.7em;
  color: #ffd1dc;
}

.small {
  font-size: 0.9em;
  opacity: 0.9;
}

button {
  margin-top: 10px;
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}

/* 💌 SECRET */
#secret {
  display:none;
  position:absolute;
  width:100%;
  height:100%;
  background:black;
  z-index:999;
  text-align:center;
  padding-top:120px;
}

/* ✨ EFFECTS */
.heart, .spark {
  position: absolute;
  pointer-events: none;
}

.heart { animation: float 6s linear infinite; }
.spark { width: 3px; height: 3px; background: white; border-radius: 50%; animation: sparkle 3s linear infinite; }

@keyframes float {
  0%{transform:translateY(100vh);opacity:0}
  50%{opacity:1}
  100%{transform:translateY(-10vh);opacity:0}
}

@keyframes sparkle {
  0%{transform:translateY(100vh);opacity:0}
  50%{opacity:1}
  100%{transform:translateY(-10vh);opacity:0}
}

/* 💌 typing */
#typing {
  margin-top: 10px;
  font-size: 0.9em;
  min-height: 40px;
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="music" loop preload="auto">
  <source src="music.mp3" type="audio/mp3">
</audio>

<!-- 🎬 INTRO -->
<div id="intro">
  <h1>Our Story ❤️</h1>
  <button id="enterBtn" onclick="start()">Enter Our World</button>
</div>

<!-- 🌌 MAIN -->
<div class="bg" id="bg"></div>
<div class="overlay"></div>

<div class="card" id="main" style="display:none">

  <h1>14 Weeks ❤️</h1>
  <p class="small">you make everything feel softer</p>

  <p id="countdown"></p>
  <p id="typing"></p>

  <button onclick="openSecret()">Open Secret 💌</button>

</div>

<!-- 💌 SECRET -->
<div id="secret">
  <h1 style="font-family:Great Vibes;color:#ff4d6d;">For You ❤️</h1>
  <p>i really really like you… more than i say 🫶</p>
  <button onclick="closeSecret()">Go Back</button>
</div>

<script>

const music = document.getElementById("music");

/* 🎬 START */
function start(){
  document.getElementById("intro").style.display="none";
  document.getElementById("main").style.display="block";

  music.play().catch(()=>{});

  // fallback unlock
  document.body.addEventListener("click", () => music.play(), { once:true });
}

/* 🌌 SLIDESHOW */
const images=["photo1.jpg","photo2.jpg","photo3.jpg"];
let i=0;
const bg=document.getElementById("bg");

function change(){
  bg.style.backgroundImage=`url(${images[i]})`;
  i=(i+1)%images.length;
}
change();
setInterval(change,3500);

/* 💖 EFFECTS */
function spawn(type){
  const el=document.createElement("div");
  el.className=type;
  el.innerHTML=type==="heart"?"❤":"";
  el.style.left=Math.random()*100+"vw";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),6000);
}
setInterval(()=>spawn("heart"),180);
setInterval(()=>spawn("spark"),120);

/* ⏳ COUNTDOWN */
const startDate=new Date("2026-02-08");
const target=new Date(startDate);
target.setDate(startDate.getDate()+100);

function update(){
  let d=Math.ceil((target-new Date())/(1000*60*60*24));
  document.getElementById("countdown").innerText="💫 "+d+" days until 100 days together";
}
setInterval(update,1000);
update();

/* 💌 TYPE */
const text="you make everything feel calm… like home ❤️";
let j=0;
function type(){
  if(j<text.length){
    document.getElementById("typing").innerHTML+=text[j];
    j++;
    setTimeout(type,45);
  }
}
type();

/* 💌 SECRET */
function openSecret(){
  document.getElementById("secret").style.display="block";
}
function closeSecret(){
  document.getElementById("secret").style.display="none";
}

</script>

</body>
</html>
