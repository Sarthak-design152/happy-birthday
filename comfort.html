<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>for you 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh; font-family: Inter; background: #1a0a0a; color: #f5e6d3;
  display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(180deg, #2d1215 0%, #1a0a0a 40%, #0d0505 100%);
  padding: 20px; overflow-x: hidden;
}

/* warm glow bg */
.warm-bg {
  position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 0;
  pointer-events: none;
}
.warm-bg::before {
  content: ''; position: absolute; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 20%, rgba(255,150,100,0.06) 0%, transparent 60%);
}

/* particles */
.particle {
  position: fixed; pointer-events: none; z-index: 0;
  width: 4px; height: 4px; background: radial-gradient(circle, #f5cba0, transparent);
  border-radius: 50%; opacity: 0;
  animation: floatParticle linear infinite;
}
@keyframes floatParticle {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  20% { opacity: 0.3; }
  80% { opacity: 0.3; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* main */
.container { max-width: 420px; width: 100%; position: relative; z-index: 1; padding: 40px 0 60px; }

/* candle */
#candleWrap {
  display: flex; justify-content: center; margin: 40px 0 24px; cursor: pointer;
  transition: transform 0.3s;
}
#candleWrap:active { transform: scale(0.95); }
.candle-body {
  position: relative; width: 40px; height: 80px;
  background: linear-gradient(180deg, #f5deb3, #e8c89a, #d4a574);
  border-radius: 4px 4px 6px 6px;
  box-shadow: inset -4px 0 8px rgba(0,0,0,0.15);
}
.candle-body::after {
  content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 8px; height: 6px; background: #333; border-radius: 2px 2px 0 0;
}
.candle-base {
  position: absolute; bottom: -4px; left: -6px; width: 52px; height: 6px;
  background: linear-gradient(180deg, #d4a574, #b8845a); border-radius: 3px;
}
#candleFlame {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  width: 12px; height: 20px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: radial-gradient(ellipse at 50% 30%, #fff5e6, #ffb366, #ff884d);
  box-shadow: 0 0 20px rgba(255,150,80,0.4), 0 0 40px rgba(255,150,80,0.15);
  animation: flicker 0.3s ease-in-out infinite alternate;
  opacity: 0; transition: opacity 0.8s ease;
}
#candleFlame.lit { opacity: 1; }
#candleFlame::after {
  content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 8px; background: radial-gradient(ellipse, rgba(255,255,255,0.6), transparent);
  border-radius: 50%;
}
@keyframes flicker {
  0% { transform: translateX(-50%) scale(1) rotate(-1deg); }
  100% { transform: translateX(-50%) scale(1.05) rotate(1deg); }
}
.flame-glow {
  position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,150,80,0.08), transparent 70%);
  opacity: 0; transition: opacity 1.5s ease;
}
.flame-glow.lit { opacity: 1; }
.candle-hint { font-size: 0.7rem; color: rgba(245,230,211,0.3); text-align: center; margin-top: 8px; letter-spacing: 1px; }

/* main message */
.main-msg {
  text-align: center; margin: 32px 0; padding: 0 12px;
}
.main-msg h1 {
  font-family: 'Playfair Display'; font-size: 1.6rem; font-weight: 400;
  color: #f5e6d3; line-height: 1.5; font-style: italic;
}
.main-msg p {
  font-size: 0.8rem; color: rgba(245,230,211,0.4); margin-top: 12px;
  letter-spacing: 1px; line-height: 1.6;
}

/* breathing circle */
#breatheWrap {
  display: flex; justify-content: center; margin: 32px 0; flex-direction: column; align-items: center;
}
#breatheCircle {
  width: 80px; height: 80px; border-radius: 50%;
  border: 1.5px solid rgba(245,230,211,0.15);
  display: flex; align-items: center; justify-content: center;
  transition: all 4s ease-in-out; cursor: pointer;
  background: radial-gradient(circle at center, rgba(255,150,100,0.03), transparent);
}
#breatheCircle.breathe-in {
  width: 120px; height: 120px; border-color: rgba(255,180,130,0.25);
  box-shadow: 0 0 40px rgba(255,150,100,0.06);
}
#breatheCircle.breathe-out {
  width: 80px; height: 80px; border-color: rgba(245,230,211,0.1);
}
#breatheText {
  font-size: 0.7rem; color: rgba(245,230,211,0.4); letter-spacing: 2px;
  text-transform: uppercase; transition: all 0.3s;
}
#breatheLabel {
  font-size: 0.65rem; color: rgba(245,230,211,0.25); margin-top: 10px;
  letter-spacing: 1px;
}

/* comforts */
.comforts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 24px 0; }
.comfort-card {
  padding: 16px 12px; border-radius: 14px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04);
  text-align: center; cursor: pointer; transition: all 0.4s ease;
  min-height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.comfort-card:hover { background: rgba(255,180,130,0.06); border-color: rgba(255,180,130,0.1); }
.comfort-card .cw-icon { font-size: 1.5rem; margin-bottom: 4px; }
.comfort-card .cw-label { font-size: 0.65rem; color: rgba(245,230,211,0.4); letter-spacing: 1px; text-transform: uppercase; }
.comfort-card .cw-label.open { color: #f5cba0; }
.comfort-card.opened { background: rgba(255,180,130,0.06); border-color: rgba(255,180,130,0.12); }
.comfort-msg {
  display: none; margin-top: 16px; padding: 16px; border-radius: 12px;
  background: rgba(255,255,255,0.03); font-size: 0.85rem; line-height: 1.7;
  color: #f5e6d3; text-align: center; font-family: 'Playfair Display'; font-style: italic;
}

/* his message placeholder */
#hisMessage {
  margin: 40px 0; padding: 24px; border-radius: 16px;
  border: 1px dashed rgba(255,180,130,0.15); text-align: center;
  background: rgba(255,180,130,0.02);
  min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#hisMessage .placeholder {
  font-family: 'Playfair Display'; font-size: 0.9rem; color: rgba(245,230,211,0.2);
  font-style: italic; line-height: 1.6;
}
#hisMessage .filled { display: none; font-family: 'Playfair Display'; font-size: 1rem; color: #f5e6d3; line-height: 1.7; }

/* footer */
.footer { text-align: center; margin-top: 20px; padding: 20px 0; }
.footer p { font-size: 0.6rem; color: rgba(245,230,211,0.12); letter-spacing: 1px; }
</style>
</head>
<body>

<div class="warm-bg"></div>

<div class="container">

  <!-- Candle -->
  <div id="candleWrap" onclick="toggleCandle()">
    <div class="candle-body">
      <div class="candle-base"></div>
      <div class="flame-glow" id="flameGlow"></div>
      <div id="candleFlame"></div>
    </div>
  </div>
  <p class="candle-hint">light a candle</p>

  <!-- Main Message -->
  <div class="main-msg">
    <h1>you don't have to<br>be okay today</h1>
    <p>rest. breathe. let yourself be held.<br>this space is just for you.</p>
  </div>

  <!-- Breathing Circle -->
  <div id="breatheWrap">
    <div id="breatheCircle" onclick="toggleBreathe()">
      <span id="breatheText">tap</span>
    </div>
    <p id="breatheLabel">breathe with me</p>
  </div>

  <!-- Little Comforts -->
  <p style="font-size:0.7rem;color:rgba(245,230,211,0.25);text-align:center;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">little comforts</p>
  <div class="comforts-grid">
    <div class="comfort-card" onclick="openComfort(this, 0)">
      <div class="cw-icon">🫖</div>
      <div class="cw-label">tea</div>
    </div>
    <div class="comfort-card" onclick="openComfort(this, 1)">
      <div class="cw-icon">🧣</div>
      <div class="cw-label">warmth</div>
    </div>
    <div class="comfort-card" onclick="openComfort(this, 2)">
      <div class="cw-icon">🎬</div>
      <div class="cw-label">movie</div>
    </div>
    <div class="comfort-card" onclick="openComfort(this, 3)">
      <div class="cw-icon">🛌</div>
      <div class="cw-label">rest</div>
    </div>
  </div>
  <div class="comfort-msg" id="comfortMsg"><div id="comfortText"></div></div>

  <!-- His Message -->
  <div id="hisMessage">
    <div class="placeholder" id="placeholderMsg">he hasn't written<br>his message yet 💕<br><span style="font-size:0.7rem;opacity:0.5;">come back later</span></div>
    <div class="filled" id="filledMsg"></div>
  </div>

  <div class="footer">
    <p>made with warmth ✦ for you, always</p>
  </div>

</div>

<script>
// Candle
var candleLit = localStorage.getItem("candleLit") === "true";
var flame = document.getElementById("candleFlame");
var glow = document.getElementById("flameGlow");
if (candleLit) { flame.classList.add("lit"); glow.classList.add("lit"); }
function toggleCandle() {
  candleLit = !candleLit;
  if (candleLit) { flame.classList.add("lit"); glow.classList.add("lit"); }
  else { flame.classList.remove("lit"); glow.classList.remove("lit"); }
  localStorage.setItem("candleLit", candleLit);
}

// Breathing
var breathing = false;
var breatheEl = document.getElementById("breatheCircle");
var breatheText = document.getElementById("breatheText");
var breatheLabel = document.getElementById("breatheLabel");
var breatheTimer;
function toggleBreathe() {
  if (breathing) { stopBreathe(); return; }
  breathing = true;
  breatheLabel.textContent = "tap to stop";
  doBreatheCycle();
}
function doBreatheCycle() {
  if (!breathing) return;
  breatheEl.className = "breathe-in";
  breatheText.textContent = "breathe in";
  setTimeout(function() {
    if (!breathing) return;
    breatheEl.className = "";
    breatheText.textContent = "hold";
    setTimeout(function() {
      if (!breathing) return;
      breatheEl.className = "breathe-out";
      breatheText.textContent = "breathe out";
      setTimeout(function() {
        if (!breathing) return;
        doBreatheCycle();
      }, 4000);
    }, 2000);
  }, 4000);
}
function stopBreathe() {
  breathing = false;
  clearTimeout(breatheTimer);
  breatheEl.className = "";
  breatheText.textContent = "tap";
  breatheLabel.textContent = "breathe with me";
}

// Comforts
var comfortMessages = [
  "Put the kettle on. Chamomile, ginger, or your favorite — let the warmth spread through your hands. You don't need to do anything else right now.",
  "Wrap yourself in something soft. A blanket, a hoodie, anything that feels like a hug. Let the warmth settle around you like a quiet promise.",
  "Put on something that makes you feel good. A comfort movie, a familiar show, soft music — let it play in the background while you rest.",
  "Lie down. Close your eyes. You've done enough today. The world can wait. Just let yourself be still for a little while."
];
function openComfort(el, idx) {
  var content = document.getElementById("comfortMsg");
  var text = document.getElementById("comfortText");
  if (el.classList.contains("opened")) return;
  el.classList.add("opened");
  el.querySelector(".cw-label").classList.add("open");
  content.style.display = "block";
  text.textContent = comfortMessages[idx];
  content.style.animation = "none";
  void content.offsetHeight;
  content.style.animation = "";
}

// Warm particles
(function() {
  for (var i = 0; i < 15; i++) {
    (function() {
      var p = document.createElement("div");
      p.className = "particle";
      p.style.left = (5 + Math.random() * 90) + "%";
      p.style.width = (2 + Math.random() * 4) + "px";
      p.style.height = p.style.width;
      p.style.animationDuration = (12 + Math.random() * 16) + "s";
      p.style.animationDelay = (Math.random() * 10) + "s";
      document.body.appendChild(p);
    })();
  }
})();
</script>
</body>
</html>
